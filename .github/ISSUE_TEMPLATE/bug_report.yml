name: Bug report
description: Report a problem with the SMSFlow API examples.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include sanitized commands or requests only.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Do not include Client Secrets, bearer tokens, phone numbers, or customer data.

